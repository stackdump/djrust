[package]
name = "djrust"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "The bitwrap audio engine: a deterministic beats generator, wave engine and DJ decks, with wasm, Android, C/Swift and native adapters"
license = "MIT"
repository = "https://github.com/stackdump/djrust"
homepage = "https://beats.bitwrap.io"
readme = "README.md"
build = "build.rs"
keywords = ["audio", "music", "dj", "wasm", "petri-net"]
categories = ["multimedia::audio", "wasm", "no-std"]
include = ["build.rs", "src/**/*.rs", "data/**/*.json", "schema/**/*.json", "README.md", "LICENSE", "Cargo.toml"]

[lib]
# rlib only, so `--no-default-features` stays a no_std library. Each app links its own cdylib or
# staticlib (npm/ is the one for the npm package; README.md, "Building").
crate-type = ["rlib"]

[features]
default = ["std", "host"]
# The pure engine needs nothing from std; `--no-default-features` builds it no_std + alloc.
std = []
# The live decks (`djrust::host`): the mixer and its render thread, net and sample decks, loops,
# Wander, auto-mix, stores and the journal on disk.
host = ["std", "dep:rtrb", "dep:libc"]
# Sound devices through cpal (CoreAudio, ALSA, WASAPI, AAudio).
audio = ["host", "dep:cpal"]
# SoundFont 2 voices through rustysynth (pure Rust).
sf2 = ["host", "dep:rustysynth"]
# Audio files onto a sample deck through symphonia (pure Rust; MPL-2.0, see README).
decode = ["host", "dep:symphonia"]
# Every native backend, for desktop apps.
native = ["audio", "sf2", "decode"]
# The browser: the wasm-bindgen facade that runs in an AudioWorklet (`djrust::wasm`).
wasm = ["host", "transfer", "dep:wasm-bindgen"]
# Code that publishes or fetches snapshots by CID. Off: local save / load only.
network = []
# Android: cpal on AAudio plus the JNI handshake it needs (`djrust::android`).
android = ["audio", "dep:ndk-context", "dep:jni-sys"]
# A C ABI for Swift and other native callers (`djrust::ffi`).
ffi = ["host"]
# A prepared track as bytes (`djrust::transfer`, and with `host` `djrust::host::deck::transfer`):
# compile a track in one engine instance (a worker, a Web Worker running a second wasm instance)
# and hand it to another that only installs it.
transfer = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"], optional = true }
# CIDv1 / model CIDs are sha2-256.
sha2 = { version = "0.10", default-features = false }
# Raw deflate for the share codec's gzip (flate2's pure-Rust backend, used directly so the
# engine stays no_std + alloc and builds for wasm32).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# Lazily parsed generator tables without std.
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
# libm keeps ring-layout coordinates identical on every target, wasm32 included.
libm = "0.2"
rtrb = { version = "0.3", optional = true }
cpal = { version = "0.18", optional = true }
rustysynth = { version = "1.3", optional = true }
symphonia = { version = "0.5", optional = true, features = ["mp3", "aac", "isomp4", "alac", "aiff", "caf"] }
# The wasm-bindgen CLI that generates the JS glue must match the version in the app's Cargo.lock.
wasm-bindgen = { version = "0.2.100", optional = true }
jni-sys = { version = "0.3", optional = true }
ndk-context = { version = "0.1", optional = true }

# platform/linux.rs: a real-time thread's SCHED_FIFO and clock_nanosleep (macOS uses mach).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[profile.test]
# The parity suites compose ~550 projects; unoptimised that takes over a minute.
opt-level = 2

[profile.release]
lto = "thin"
opt-level = 3

# The identity wallet is a second package in this workspace (crates/djrust-wallet). The engine
# never depends on it. npm/ is its own workspace (the cdylib for the npm package).
[workspace]
members = [".", "crates/djrust-wallet"]
exclude = ["npm"]

[[example]]
name = "boot_profile"
required-features = ["host"]
